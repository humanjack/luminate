services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      LUMINATE_DATA_DIR: /data
      # Optional legacy settings sync; generation runs in Next.js (issue #60).
      BACKEND_URL: ""
    volumes:
      - luminate-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  # The frozen backend is reference-only, not needed by this deployment.
  # To revive it, first implement the contract in docs/runtime-boundary.md (#60).
  # backend:
  #   build: ./backend  # Requires its own maintained Dockerfile and API contract.
volumes:
  luminate-data:
